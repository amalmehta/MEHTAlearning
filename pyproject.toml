[project]
name = "mehta"
version = "0.1.0"
description = "MEHTA learning: PEARL latents meet long-horizon MAML for meta-RL post-training"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",        # last release with macOS x86_64 wheels
    "numpy>=1.26,<2",
    "matplotlib>=3.8,<3.10",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]
metaworld = [
    "metaworld==3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
